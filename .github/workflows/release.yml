name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag"
        required: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${{ github.ref_name }}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Release ${{ steps.tag.outputs.tag }}
            
            ### 📋 Changes
            - Auto-generated release from tag `${{ steps.tag.outputs.tag }}`
            
            ---
            *Commit: ${{ github.sha }}*
          draft: false
          prerelease: false
          token: ${{ github.token }}
      - name: Manage latest flag
        run: |
          MAJOR=$(echo "${{ steps.tag.outputs.tag }}" | grep -oE '^v([0-9]+)' | tr -d 'v')
          
          if [[ "$MAJOR" -ge 4 ]]; then
            gh release edit "${{ steps.tag.outputs.tag }}" --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}