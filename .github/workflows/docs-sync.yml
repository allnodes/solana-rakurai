name: Docs Sync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run workflow from"
        required: true

jobs:
  push-doc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.ref_name, 'pre-release') &&
       !contains(github.ref_name, 'testnet'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # 2. Clone central docs repo
      - name: Clone central docs repo
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/rakurai-io/rakurai-docs.git

      # 3. Create directory structure and copy files
      - name: Copy docs into structured directories
        run: |
          REPO_NAME=${{ github.event.repository.name }}

          # Create subdirectories
          mkdir -p rakurai-docs/docs/services/$REPO_NAME/spark-geyser/

          # Copy README.md files
          cp README.md rakurai-docs/docs/services/$REPO_NAME/README.md
          cp Running-Geyser-with-Rakurai-Client.md rakurai-docs/docs/services/$REPO_NAME/Running-Geyser-with-Rakurai-Client.md
          cp VERIFY-BINARY-ATTESTATION.md  rakurai-docs/docs/services/$REPO_NAME/VERIFY-BINARY-ATTESTATION.md
          cp spark-geyser/README.md rakurai-docs/docs/services/$REPO_NAME/spark-geyser/README.md
          cp spark-geyser/config.json rakurai-docs/docs/services/$REPO_NAME/spark-geyser/config.json

      # 4. Commit & push
      - name: Commit and push
        run: |
          cd rakurai-docs
          git config user.name "saadkhan2495"
          git config user.email "saadkhan2495@gmail.com"
          git add docs/services/${{ github.event.repository.name }}/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update ${{ github.event.repository.name }} doc"
          git push
